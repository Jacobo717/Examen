services:
  hadoop:
    image: examen-hadoop:local
    build: ./hadoop
    hostname: hadoop
    environment:
      HADOOP_USER_NAME: hadoop
    volumes:
      - ./data/input:/data/input:ro
      - ./data/output:/data/output
      - ./mapreduce:/app:ro
      - ssh-keys:/shared-ssh
    networks: [datamart]
    healthcheck:
      test: ["CMD-SHELL", "test -f /shared-ssh/id_ed25519.pub"]
      interval: 3s
      timeout: 2s
      retries: 20
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [datamart]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  job:
    image: examen-hadoop:local
    pull_policy: never
    working_dir: /tmp
    entrypoint: ["/bin/bash"]
    environment:
      HADOOP_USER_NAME: hadoop
      MATRICULA: ${MATRICULA:-125054263}
    command: ["/app/ejecutar_job.sh"]
    volumes:
      - ./data/input:/data/input:ro
      - ./data/output:/data/output
      - ./mapreduce:/app:ro
    depends_on:
      hadoop:
        condition: service_healthy
    networks: [datamart]
    restart: "no"
  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MATRICULA: ${MATRICULA:-125054263}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data/output:/data/output:ro
      - ssh-keys:/shared-ssh:ro
    depends_on:
      job:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks: [datamart]
volumes:
  postgres-data:
  ssh-keys:
networks:
  datamart:

