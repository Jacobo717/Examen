<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DataMart</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#222}
    main{max-width:900px;margin:40px auto;background:white;padding:28px;border-radius:12px;box-shadow:0 2px 10px #0002}
    h1{color:#174a7c;margin-bottom:6px}p{color:#555}
    table{width:100%;border-collapse:collapse;margin-top:24px}
    th,td{padding:12px;text-align:left;border-bottom:1px solid #ddd}
    th{background:#174a7c;color:white}td:nth-child(2){font-weight:bold;color:#174a7c}
    #estado{color:#388e3c;font-size:14px}a{color:#174a7c}
  </style>
</head>
<body>
  <main>
    <h1>DataMart</h1>
    <p>Ticket promedio por tienda</p>
    <p id="estado">Cargando resultados...</p>
    <table>
      <thead><tr><th>Tienda</th><th>Ticket promedio</th><th>Registros</th></tr></thead>
      <tbody id="resultados"></tbody>
    </table>
    <p><a href="/docs">Ver API técnica</a></p>
  </main>
  <script>
    function moneda(valor){return new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(valor)}
    async function cargar(){
      const respuesta=await fetch('/resultados');
      const datos=await respuesta.json();
      document.getElementById('resultados').innerHTML=datos.map(x=>`<tr><td>${x.clave}</td><td>${moneda(x.ticket_promedio)}</td><td>${x.registros.toLocaleString('es-MX')}</td></tr>`).join('');
      document.getElementById('estado').textContent=`${datos.length} tiendas cargadas automáticamente`;
    }
    cargar();
  </script>
</body>
</html>
